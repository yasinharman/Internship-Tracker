services:
  # 1. START THE DATABASE SERVICE
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. START THE AUTOMATION SERVICE (main.py)
  # Local development only, and the local development is all there is right
  # now - see main.py. While this was hosted, Coolify started the container
  # idle (`sleep infinity`, the Dockerfile CMD) and fired `python main.py` as
  # a scheduled task, so the schedule was never baked into the image.
  #
  # --schedule is required here: without it main.py exits after one crawl and
  # `restart: unless-stopped` would immediately start another, forever.
  scraper:
    build: .
    command: python main.py --schedule
    depends_on:
      db:
        condition: service_healthy
    environment:
      # In Docker 'db' is used instead of 'localhost'
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SCRAPEOPS_API_KEY: ${SCRAPEOPS_API_KEY}
    restart: unless-stopped

  # 3. START THE DASHBOARD SERVICE
  #
  # `target: dashboard` is required, not decorative. The Dockerfile's last
  # stage is `worker` on purpose, so a plain `build: .` would produce the
  # scraper image - which has no web/dist in it, and would serve a blank page
  # while looking like a successful deploy.
  dashboard:
    build:
      context: .
      target: dashboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    # Without this the board runs but is only reachable from inside the compose
    # network - it was missing before and the dashboard was unreachable locally.
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  pg_data:
