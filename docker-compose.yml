services:
  # 1. START THE DATABASE SERVICE
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. START THE AUTOMATION SERVICE (main.py)
  # Local development only. In production Coolify starts the container idle
  # (`sleep infinity`, the Dockerfile CMD) and fires `python main.py` as a
  # scheduled task, so the schedule is not baked into the image.
  #
  # --schedule is required here: without it main.py exits after one crawl and
  # `restart: unless-stopped` would immediately start another, forever.
  scraper:
    build: .
    command: python main.py --schedule
    depends_on:
      db:
        condition: service_healthy
    environment:
      # In Docker 'db' is used instead of 'localhost'
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SCRAPEOPS_API_KEY: ${SCRAPEOPS_API_KEY}
    restart: unless-stopped

  # 3. START THE DASHBOARD SERVICE
  dashboard:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    restart: unless-stopped

volumes:
  pg_data:
